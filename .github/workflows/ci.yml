name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: Protocol tests (fake head unit + bridge on a JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: bridge/test.sh

  mod:
    name: Build the car mod (APK + service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        env:
          # without a key secret, the APK is signed with a throwaway key: fine to test, not to install as an update
          IR2_APK_KEYSTORE_B64: ${{ secrets.IR2_APK_KEYSTORE_B64 }}
          IR2_APK_KEYSTORE_PASS: ${{ secrets.IR2_APK_KEYSTORE_PASS }}
        run: |
          if [ -n "$IR2_APK_KEYSTORE_B64" ]; then
            mkdir -p bridge/.keys && echo "$IR2_APK_KEYSTORE_B64" | base64 -d > bridge/.keys/ci.p12
            export IR2_APK_KEYSTORE=bridge/.keys/ci.p12
          else
            unset IR2_APK_KEYSTORE_PASS
          fi
          bridge/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ir2-companion-mod
          path: out/ir2-companion-*.zip

  ios:
    name: iPhone app (Ir2Kit tests + app build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ir2Kit tests (against the fake head unit)
        working-directory: ios/Ir2Kit
        run: swift test
      - name: Generate the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild -project Ir2.xcodeproj -scheme Ir2 -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
